# Port-80 vhost: serve ACME (Let's Encrypt) challenges, redirect the rest to
# HTTPS. Mounted into the `redirect` nginx container (see
# deploy/docker-compose.override.prod.yml).
server {
    listen 80;
    server_name _;

    # Certbot webroot renewals — must NOT be redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
