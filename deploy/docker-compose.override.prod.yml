# Production override: real TLS via Let's Encrypt + HTTP->HTTPS redirect.
#
# Activate on the host with:
#   cp deploy/docker-compose.override.prod.yml docker-compose.override.yml
#   docker compose up -d redirect        # before first cert issuance
#   certbot certonly --webroot -w /opt/apps/certbot-webroot \
#     -d forte-voice.click -d www.forte-voice.click \
#     --deploy-hook "docker restart banking-assistant-web-1"
#   docker compose up -d web             # switch web to the real cert
#
# Local development needs none of this — without the override the web image
# falls back to its baked-in self-signed cert.
services:
  redirect:
    image: nginx:alpine
    ports: ["80:80"]
    volumes:
      - ./deploy/redirect.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/apps/certbot-webroot:/var/www/certbot:ro
    restart: unless-stopped

  web:
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    command:
      [
        "uvicorn", "web.app:app", "--host", "0.0.0.0", "--port", "8443",
        "--ssl-keyfile", "/etc/letsencrypt/live/forte-voice.click/privkey.pem",
        "--ssl-certfile", "/etc/letsencrypt/live/forte-voice.click/fullchain.pem",
      ]
