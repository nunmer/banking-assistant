services:

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    ports: ["8080:8000"]
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      mib-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports: ["443:8443"]
    env_file: .env
    volumes:
      # Admin panel log viewer (web/admin/docker_logs.py) — read access to
      # every container on this daemon. See the admin-panel plan for the
      # security tradeoff this represents; deliberate, not an oversight.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      orchestrator:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, ssl; urllib.request.urlopen('https://localhost:8443/health', context=ssl._create_unverified_context())"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  mib-service:
    build:
      context: .
      dockerfile: mib-service/Dockerfile
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  speech-service:
    build:
      context: ./speech-service
      dockerfile: Dockerfile
    image: speech-service:latest
    command: ["api"]
    ports: ["8000:8000"]
    env_file: ./speech-service/.env
    environment:
      LOG_JSON: "true"
    volumes:
      - uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ./speech-service
      dockerfile: Dockerfile
    image: speech-service:latest
    command: ["worker"]
    env_file: ./speech-service/.env
    environment:
      LOG_JSON: "true"
    volumes:
      - uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    # The image HEALTHCHECK curls the API port, which doesn't exist in the
    # worker role — probe Celery itself instead.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app.celery_app inspect ping -d celery@$$(hostname) --timeout 10 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Single shared Redis for both the orchestrator/web session store (DB 0)
  # and speech-service's Celery broker/results/cache (DB 3/4/5 — see
  # speech-service/.env.example). Stateless on purpose: no volume, no AOF —
  # the target environment has no PVC, and nothing stored here is durable
  # source-of-truth data (sessions, job queue, rate-limit/dedup cache all
  # tolerate a restart).
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  uploads:
